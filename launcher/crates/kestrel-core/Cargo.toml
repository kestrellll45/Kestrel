[package]
name = "kestrel-core"
edition.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3"
hex = "0.4.3"
log = "0.4.34"
md-5 = "0.11.0"
png = "0.18"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Memory"] }
