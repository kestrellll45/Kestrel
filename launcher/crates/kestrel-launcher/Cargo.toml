[package]
name = "kestrel-launcher"
edition.workspace = true
version.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "accesskit", "links"] }
egui = "0.37.0"
kestrel-core = { path = "../kestrel-core" }
log = "0.4.34"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
semver = "1"

[features]
# Test-only: lets KESTREL_E2E_UPDATE_DIR serve the signed manifest and exe from
# a local folder (all verification still applies) and adds a start-up failure
# switch for rollback testing. NEVER enabled in release builds: release.ps1
# rejects any exe whose self-check reports these hooks.
e2e-update-test = []

[build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "3"
hex = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"

[package.metadata.winresource]
ProductName = "Kestrel"
FileDescription = "Kestrel Minecraft 1.8.9 launcher"
LegalCopyright = "Not affiliated with Mojang or Microsoft"
